<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beat Builds</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@600;800&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #0b0907; --panel: #15110d; --line: #2a221a; --ink: #efe3c6; --dim: #8c7d66; --gold: #d9a441; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 Inter, system-ui, sans-serif; display: grid; grid-template-columns: 1fr 300px; height: 100vh; }
  main { display: grid; place-items: center; padding: 16px; min-width: 0; }
  canvas { width: 100%; max-height: calc(100vh - 32px); aspect-ratio: 16 / 9; object-fit: contain; background: #000; border: 1px solid var(--line); }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { flex: 1 1 auto; }
  button { background: #201912; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; cursor: pointer; }
  button.on { background: var(--gold); color: #1a1209; border-color: var(--gold); font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  label.row { display: grid; grid-template-columns: 90px 1fr 36px; align-items: center; gap: 8px; color: var(--dim); }
  label.row output { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--gold); }
  .check { display: flex; gap: 8px; align-items: center; color: var(--dim); }
  .transport { display: flex; gap: 6px; }
  .note { color: var(--dim); font-size: 12px; }
  body.bare { display: block; } body.bare aside { display: none; } body.bare main { padding: 0; } body.bare canvas { border: 0; max-height: none; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; height: auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<main><canvas id="c" width="1920" height="1080"></canvas></main>
<aside>
  <h1>Beat builds</h1>
  <div class="group"><span class="label">Effect</span><div class="seg" id="effect"></div></div>
  <div class="group"><span class="label">Arrival (ASCII)</span><div class="seg" id="arrival"></div><span class="label">Fill order</span><div class="seg" id="order"></div></div>
  <div class="group"><span class="label">Beat</span><div class="seg" id="beat"></div></div>
  <div class="group"><span class="label">Source image</span><div class="seg" id="source"></div><div class="seg" id="tone"></div></div>
  <div class="group">
    <span class="label">Transport</span>
    <div class="transport">
      <button id="play">Play</button><button id="restart">Restart</button><button id="rec">Record .webm</button>
    </div>
    <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" />
  </div>
  <div class="group" id="sliders"><span class="label">Image prep</span></div>
  <div class="group"><span class="label">Straight edges</span><div class="seg" id="edge"></div></div>
  <div class="group"><span class="label">Look</span><div class="seg" id="palette"></div><div class="group" id="toggles"></div></div>
  <p class="note">Narration is simulated at the WPM above (no audio yet). Space = play/pause.</p>
</aside>
<script type="module" src="main.js"></script>
</body>
</html>
